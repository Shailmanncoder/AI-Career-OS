services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: careeros
      POSTGRES_PASSWORD: careeros
      POSTGRES_DB: ai_career_os
    ports:
      - "5433:5432"
    volumes:
      - careeros-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careeros -d ai_career_os"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://careeros:careeros@db:5432/ai_career_os?schema=public
      DATABASE_URL_UNPOOLED: postgresql://careeros:careeros@db:5432/ai_career_os?schema=public

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://careeros:careeros@db:5432/ai_career_os?schema=public
      DATABASE_URL_UNPOOLED: postgresql://careeros:careeros@db:5432/ai_career_os?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-docker-local-development-secret-change-me}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      NEXTAUTH_URL: ${AUTH_URL:-http://localhost:3000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
    ports:
      - "3000:3000"

volumes:
  careeros-db:
